[project]
name = "rubble-rescue-quadruped"
version = "0.1.0"
description = "Prior-guided, safety-aware search and approach for a quadruped in rubble (HCR course project)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["rescue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
